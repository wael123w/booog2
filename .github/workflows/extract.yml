name: Extract Crypto Coin ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'Crypto Coin Tap-2-Earn.zip'
      - '.github/workflows/extract.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract ZIP into repository root
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="Crypto Coin Tap-2-Earn.zip"
          test -f "$ZIP_FILE"
          mkdir -p .extract_tmp
          unzip -q -o "$ZIP_FILE" -d .extract_tmp

          # If the archive contains one top-level directory, use its contents.
          shopt -s dotglob nullglob
          items=(.extract_tmp/*)
          if [ "${#items[@]}" -eq 1 ] && [ -d "${items[0]}" ]; then
            cp -a "${items[0]}"/. ./
          else
            cp -a .extract_tmp/. ./
          fi

          rm -rf .extract_tmp
          echo 'Repository files after extraction:'
          find . -maxdepth 3 -type f -not -path './.git/*' | sort | head -300

      - name: Remove ZIP from repository
        run: rm -f "Crypto Coin Tap-2-Earn.zip"

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m "Extract Crypto Coin Tap-2-Earn into repository"
          git push
